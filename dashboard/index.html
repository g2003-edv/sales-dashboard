<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销售数据可视化看板</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f0f2f5;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #1890ff 0%, #722ed1 100%);
            color: white;
            padding: 30px 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 28px; font-weight: 500; }
        .header p { opacity: 0.85; margin-top: 8px; font-size: 14px; }
        
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 24px 40px;
        }
        .metric-card {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .metric-value {
            font-size: 32px;
            font-weight: 600;
            color: #1890ff;
            margin-bottom: 8px;
        }
        .metric-label { color: #666; font-size: 14px; }
        .metric-change {
            font-size: 12px;
            color: #52c41a;
            margin-top: 4px;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
            gap: 20px;
            padding: 0 40px 24px;
        }
        .chart-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            padding: 20px;
        }
        .chart-card h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .chart-container { width: 100%; height: 320px; }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #999;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>销售数据可视化看板</h1>
        <p>2024 年度全渠道销售数据分析 | 基于 SQLite + Python + ECharts</p>
    </div>
    
    <div class="metrics">
        <div class="metric-card">
            <div class="metric-value">¥10,361,973</div>
            <div class="metric-label">总销售额</div>
            <div class="metric-change">同比 +23.5%</div>
        </div>
        <div class="metric-card">

        </div>
        <div class="metric-card">

        <div class="metric-card">
            <div class="metric-value">¥2072</div>
            <div class="metric-label">客单价</div>
            <div class="metric-change">同比 +4.5%</div>
        </div>
    </div>
    
    <div class="charts-grid">
        <div class="chart-card">
            <h3>月度销售趋势</h3>
            <div id="monthlyChart" class="chart-container"></div>
        </div>
        <div class="chart-card">
            <h3>品类销售占比</h3>
            <div id="categoryChart" class="chart-container"></div>
        </div>
        <div class="chart-card">
            <h3>区域销售分布</h3>

        </div>
        <div class="chart-card">

        </div>
        <div class="chart-card">

        </div>
        <div class="chart-card">

        </div>
    </div>
    
    <div class="footer">
